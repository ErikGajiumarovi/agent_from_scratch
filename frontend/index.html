<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-агент — чат</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #f4f4f2; color: #222; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           background: #222; color: #eee; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; }
  header .status { font-size: 12px; color: #bbb; flex: 1; }
  header button { background: #444; color: #eee; border: 0; border-radius: 6px;
                  padding: 6px 12px; cursor: pointer; }
  header button:hover { background: #555; }
  header select { background: #444; color: #eee; border: 0; border-radius: 6px;
                  padding: 6px 8px; max-width: 280px; cursor: pointer; }
  main { display: flex; gap: 12px; padding: 12px; height: calc(100vh - 49px); }
  section { background: #fff; border: 1px solid #ddd; border-radius: 8px;
            display: flex; flex-direction: column; min-width: 0; }
  #chat-pane { flex: 1; }
  #raw-pane { flex: 1; }
  h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid #eee;
       color: #666; text-transform: uppercase; letter-spacing: .04em; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
         word-break: break-word; }
  .msg.user { align-self: flex-end; background: #dceaff; }
  .msg.assistant { align-self: flex-start; background: #ececec; }
  .msg.tool { align-self: flex-start; background: #f7f3df; border: 1px dashed #c9bd7a;
              font-size: 12.5px; max-width: 95%; }
  .msg.error { align-self: flex-start; background: #f8d7da; }
  #form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eee; }
  #form input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #form button { padding: 8px 16px; border: 0; border-radius: 6px; background: #1a73e8;
                 color: #fff; cursor: pointer; }
  #form button:disabled { background: #999; cursor: default; }
  #rawlog { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 12.5px;
            display: flex; flex-direction: column; gap: 6px; }
  .ev { border: 1px solid #e3e3e3; border-radius: 6px; padding: 6px 8px; background: #fafafa; }
  .ev .tag { display: inline-block; min-width: 74px; font-weight: 700; }
  .ev.tool_call .tag { color: #8a6d00; }
  .ev.tool_result .tag { color: #0b6e4f; }
  .ev.answer .tag { color: #1a73e8; }
  .ev.status .tag, .ev.done .tag { color: #888; }
  .ev.error .tag { color: #b00020; }
  .ev pre { background: #222; color: #ddd; padding: 8px; border-radius: 6px;
            overflow-x: auto; font-size: 11.5px; }
  #state { border-top: 1px solid #eee; max-height: 38%; overflow-y: auto; padding: 8px 12px; }
  #state details { font-size: 12px; margin-bottom: 4px; }
  #state summary { cursor: pointer; }
  #state pre { background: #222; color: #ddd; padding: 8px; border-radius: 6px;
               overflow-x: auto; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>ИИ-агент</h1>
  <select id="model" title="Модель"></select>
  <span class="status" id="status">подключение…</span>
  <button id="btn-refresh" type="button">Обновить</button>
  <button id="btn-reset" type="button">Сбросить диалог</button>
</header>
<main>
  <section id="chat-pane">
    <h2>Чат</h2>
    <div id="chat"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Спросите что-нибудь…" autocomplete="off">
      <button id="send" type="submit">Отправить</button>
    </form>
  </section>
  <section id="raw-pane">
    <h2>Под капотом (сырые события хода)</h2>
    <div id="rawlog"><div class="ev status"><span class="tag">idle</span> отправьте сообщение — здесь появятся вызовы модели и инструментов</div></div>
    <h2>Состояние треда (все сообщения)</h2>
    <div id="state"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), rawlog = $("rawlog"), state = $("state"),
      form = $("form"), input = $("input"), sendBtn = $("send");

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function scrollDown(el) { el.scrollTop = el.scrollHeight; }
function addMsg(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  scrollDown(chat);
  return d;
}
function addEvent(type, title, obj) {
  const d = document.createElement("div");
  d.className = "ev " + esc(type);
  d.innerHTML = "<span class='tag'>" + esc(type) + "</span> " + esc(title) +
    (obj !== undefined
      ? "<details><summary>json</summary><pre>" + esc(JSON.stringify(obj, null, 2)) + "</pre></details>"
      : "");
  rawlog.appendChild(d);
  scrollDown(rawlog);
}
function preview(m) {
  const t = m.type || "?";
  let c = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
  if ((m.tool_calls || []).length) c = "tool_call: " + m.tool_calls.map((x) => x.name).join(", ") + (c ? " | " + c : "");
  return "[" + t + "] " + (c || "").slice(0, 90);
}

// --- отрисовка полного чата и состояния по /api/history ---
function renderHistory(messages) {
  chat.innerHTML = "";
  messages.forEach((m) => {
    if (m.type === "human") addMsg("user", esc(m.content));
    else if (m.type === "ai") {
      if ((m.tool_calls || []).length && !m.content)
        addMsg("tool", "вызывает: " + esc(m.tool_calls.map((x) => x.name + "(" + JSON.stringify(x.args) + ")").join(", ")));
      else if (m.content) addMsg("assistant", esc(m.content));
    }
    else if (m.type === "tool")
      addMsg("tool", "[" + esc(m.name || "tool") + "] " + esc(String(m.content).slice(0, 500)));
  });
  state.innerHTML = "";
  messages.forEach((m, i) => {
    const d = document.createElement("details");
    d.innerHTML = "<summary>#" + i + " " + esc(preview(m)) + "</summary><pre>" +
      esc(JSON.stringify(m, null, 2)) + "</pre>";
    state.appendChild(d);
  });
}

async function refresh() {
  try {
    const [st, hi, mo] = await Promise.all([
      fetch("/api/status").then((r) => r.json()),
      fetch("/api/history").then((r) => r.json()),
      fetch("/api/models").then((r) => r.json()),
    ]);
    $("status").textContent =
      st.provider + " · тред " + st.thread_id + " · " + st.message_count + " сообщений · " + st.db_path;
    renderModelSelect(mo);
    renderHistory(hi.messages);
  } catch (e) {
    $("status").textContent = "ошибка соединения: " + e;
  }
}

function renderModelSelect(mo) {
  const sel = $("model");
  const current = mo.current;
  const names = mo.models.includes(current) ? mo.models : [current, ...mo.models];
  sel.innerHTML = "";
  names.forEach((n) => {
    const o = document.createElement("option");
    o.value = n;
    o.textContent = n + (n === mo.models[0] ? "" : "");
    if (n === current) o.selected = true;
    sel.appendChild(o);
  });
  const custom = document.createElement("option");
  custom.value = "__custom__";
  custom.textContent = "другая… (ввести вручную)";
  sel.appendChild(custom);
  sel.title = "Провайдер: " + mo.provider + ". Выбор «другая» — произвольное имя модели.";
}

$("model").addEventListener("change", async (e) => {
  let name = e.target.value;
  if (name === "__custom__") {
    name = (prompt("Имя модели:", "") || "").trim();
    if (!name) { refresh(); return; }
  }
  try {
    const r = await fetch("/api/model", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name}),
    }).then((r) => r.json());
    if (r.ok) addEvent("status", "модель переключена: " + r.model, r);
    else addMsg("error", "Не переключил модель: " + (r.error || "?"));
  } catch (err) {
    addMsg("error", "Ошибка соединения: " + err);
  }
  refresh();
});

// --- отправка: SSE-стрим /api/chat, живое обновление обеих панелей ---
let busy = false;
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  input.value = "";
  sendBtn.disabled = true;
  addMsg("user", esc(text));
  const thinking = addMsg("assistant", "<i>думает…</i>");
  addEvent("status", "ход начат: " + text);

  try {
    const resp = await fetch("/api/chat?text=" + encodeURIComponent(text));
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", answerText = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.type === "tool_call") {
            addEvent("tool_call", ev.name + "(" + JSON.stringify(ev.args) + ")", ev);
            addMsg("tool", "вызов " + esc(ev.name) + "(" + esc(JSON.stringify(ev.args)) + ")");
          } else if (ev.type === "tool_result") {
            addEvent("tool_result", (ev.name || "tool") + " → " + String(ev.content).slice(0, 200), ev);
            addMsg("tool", "[" + esc(ev.name || "tool") + "] " + esc(String(ev.content).slice(0, 500)));
          } else if (ev.type === "answer") {
            answerText = ev.text;
            thinking.innerHTML = esc(ev.text);
            scrollDown(chat);
            addEvent("answer", ev.text.slice(0, 200), ev);
          } else if (ev.type === "done") {
            addEvent("done", "ход завершён, сообщений: " + ev.message_count, ev);
          } else if (ev.type === "error") {
            thinking.className = "msg error";
            thinking.textContent = "Ошибка: " + ev.text;
            addEvent("error", ev.text, ev);
          } else if (ev.type === "status") {
            addEvent("status", ev.text, ev);
          }
        }
      }
    }
    if (answerText === null && thinking) thinking.remove();
  } catch (err) {
    thinking.className = "msg error";
    thinking.textContent = "Ошибка соединения: " + err;
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
    refresh();
  }
});

$("btn-refresh").addEventListener("click", refresh);
$("btn-reset").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  rawlog.innerHTML = "";
  addEvent("status", "диалог сброшен");
  refresh();
});

refresh();
</script>
</body>
</html>
